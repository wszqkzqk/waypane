<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="waypane-logo-title waypane-logo-desc">
  <title id="waypane-logo-title">Waypane</title>
  <desc id="waypane-logo-desc">A flowing W linking a Wayland source window to a native receiver window.</desc>
  <defs>
    <linearGradient id="pane" x1="72" y1="72" x2="440" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.48" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="screen" x1="256" y1="136" x2="256" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="stream" x1="132" y1="196" x2="380" y2="326" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F0F9FF"/>
      <stop offset="1" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="inset" x1="302" y1="252" x2="450" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <clipPath id="pane-clip">
      <rect x="72" y="72" width="368" height="336" rx="56"/>
    </clipPath>
    <clipPath id="receiver-clip">
      <rect x="302" y="218" width="148" height="190" rx="20"/>
    </clipPath>
  </defs>

  <g>
    <rect x="72" y="72" width="368" height="336" rx="56" fill="url(#pane)"/>
    <path d="M128 72H384C414.928 72 440 97.072 440 128V136H72V128C72 97.072 97.072 72 128 72Z" fill="#FFFFFF" fill-opacity="0.14"/>
    <rect x="72" y="136" width="368" height="272" fill="url(#screen)" clip-path="url(#pane-clip)"/>
    <circle cx="116" cy="104" r="9" fill="#FFFFFF" fill-opacity="0.95"/>
    <circle cx="148" cy="104" r="9" fill="#FFFFFF" fill-opacity="0.65"/>
    <circle cx="180" cy="104" r="9" fill="#FFFFFF" fill-opacity="0.4"/>
    <path d="M132 196C152 268 168 326 198 326C228 326 240 232 256 232C272 232 284 326 314 326C344 326 360 268 380 196" fill="none" stroke="url(#stream)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g>
    <rect x="296" y="214" width="168" height="200" rx="28" fill="#0F172A" fill-opacity="0.2"/>
    <rect x="292" y="208" width="168" height="200" rx="28" fill="#F8FAFC"/>
    <g clip-path="url(#receiver-clip)">
      <rect x="302" y="218" width="148" height="190" fill="url(#inset)"/>
      <path d="M322 218H430C441.046 218 450 226.954 450 238V252H302V238C302 226.954 310.954 218 322 218Z" fill="#E2E8F0"/>
    </g>
    <circle cx="322" cy="235" r="5" fill="#3B82F6"/>
    <circle cx="340" cy="235" r="5" fill="#94A3B8"/>
    <circle cx="358" cy="235" r="5" fill="#CBD5E1"/>
    <rect x="322" y="268" width="100" height="14" rx="7" fill="#60A5FA"/>
    <rect x="322" y="300" width="64" height="14" rx="7" fill="#67E8F9" fill-opacity="0.9"/>
    <rect x="322" y="332" width="82" height="14" rx="7" fill="#A78BFA" fill-opacity="0.92"/>
  </g>
</svg>
