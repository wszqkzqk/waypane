name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: quality
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --features jni-check --locked -- -D warnings

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            binary: waypane-desktop
          - os: windows-latest
            binary: waypane-desktop.exe
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.os }}
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Build desktop application
        run: cargo build --release --locked -p waypane-desktop
      - name: Upload desktop binary
        uses: actions/upload-artifact@v7
        with:
          name: waypane-desktop-${{ runner.os }}-${{ runner.arch }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14

  upstream-interop:
    name: Upstream Waypipe interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: upstream-interop
      - name: Install upstream build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bindgen \
            libclang-dev \
            liblz4-dev \
            libzstd-dev \
            openssh-server \
            pkg-config
      - name: Build upstream Waypipe without GPU or video
        env:
          WAYPIPE_VERSION: |-
            waypipe 0.11.3
            features:
              lz4: true
              zstd: true
              dmabuf: false
              video: false
        run: |
          cargo build \
            --manifest-path vendor/waypipe/Cargo.toml \
            --locked \
            --release \
            --no-default-features \
            --features lz4,zstd \
            --bin waypipe \
            --target-dir target/upstream-waypipe
          target/upstream-waypipe/release/waypipe --version
      - name: Test wire protocol, SHM, files, and compression
        env:
          WAYPIPE_TEST_BINARY: ${{ github.workspace }}/target/upstream-waypipe/release/waypipe
          WAYPIPE_TEST_COMPRESSIONS: none,lz4,zstd
        run: cargo test -p waypipe-client --locked --test upstream_shm -- --ignored --nocapture
      - name: Test clipboard, text input, and toplevel protocols
        env:
          WAYPIPE_TEST_BINARY: ${{ github.workspace }}/target/upstream-waypipe/release/waypipe
        run: |
          cargo test -p waypane-core --locked \
            --test upstream_clipboard \
            --test upstream_text_input \
            --test upstream_toplevel \
            -- --ignored --nocapture
      - name: Test real SSH, TOFU, encrypted keys, and Termux TMPDIR
        env:
          WAYPIPE_TEST_BINARY: ${{ github.workspace }}/target/upstream-waypipe/release/waypipe
          WAYPIPE_SSHD: /usr/sbin/sshd
        run: |
          sudo mkdir -p /run/sshd
          sudo chmod 0755 /run/sshd
          sudo mkdir -p /data/data/com.termux/files/usr/tmp
          sudo chown -R "$(id -u):$(id -g)" /data/data/com.termux
          cargo test -p waypane-core --locked --test upstream_ssh -- --ignored --nocapture

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Resolve latest LTS JDK
        id: jdk
        run: |
          version="$(curl -fsSL https://api.adoptium.net/v3/info/available_releases \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["most_recent_lts"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install latest LTS JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.version }}
      - name: Set up Android SDK 37
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.2 build-tools;37.0.0"
          log-accepted-android-sdk-licenses: false
      - name: Install current Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: current
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install latest cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64
      - name: Restore persistent CI debug signing key
        if: github.event_name != 'pull_request'
        uses: actions/cache@v6
        with:
          path: /home/runner/.android/debug.keystore
          key: waypane-android-ci-debug-signing-v1
      - name: Build debug APK with the runner's latest NDK
        working-directory: apps/android
        run: |
          test -n "${ANDROID_NDK_LATEST_HOME:-}"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          cargo ndk --version
          grep '^Pkg.Revision' "$ANDROID_NDK_HOME/source.properties"
          gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: waypane-android-debug-arm64
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
