name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: quality
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --features jni-check --locked -- -D warnings

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            binary: waypane-desktop
          - os: windows-latest
            binary: waypane-desktop.exe
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.os }}
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Build desktop application
        run: cargo build --release --locked -p waypane-desktop
      - name: Upload desktop binary
        uses: actions/upload-artifact@v7
        with:
          name: waypane-desktop-${{ runner.os }}-${{ runner.arch }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14

  upstream-interop:
    name: Upstream Waypipe interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: upstream-interop
      - name: Install upstream build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bindgen \
            libclang-dev \
            liblz4-dev \
            libzstd-dev \
            openssh-server \
            pkg-config
      - name: Verify vendored Waypipe matches upstream
        run: scripts/waypipe-upstream.sh verify
      - name: Build vendored upstream Waypipe without GPU or video
        run: |
          cargo build \
            --manifest-path vendor/waypipe/Cargo.toml \
            --locked \
            --release \
            --no-default-features \
            --features lz4,zstd \
            --bin waypipe \
            --target-dir target/upstream-waypipe
          binary="$PWD/target/upstream-waypipe/release/waypipe"
          echo "WAYPIPE_TEST_BINARY=$binary" >> "$GITHUB_ENV"
          { echo 'WAYPIPE_VERSION<<EOF'; "$binary" --version; echo EOF; } >> "$GITHUB_ENV"
          "$binary" --version
      - name: Resolve newest upstream baseline
        id: upstream-baselines
        run: |
          newer=$(python3 -c "import tomllib; m=tomllib.load(open('vendor/waypipe.upstream.toml','rb')); print(str(m['latest_commit'] != m['commit']).lower())")
          echo "has_latest=$newer" >> "$GITHUB_OUTPUT"
      - name: Test wire protocol, SHM, files, and compression
        env:
          WAYPIPE_TEST_COMPRESSIONS: none,lz4,zstd
        run: cargo test -p waypipe-client --locked --test upstream_shm -- --ignored --nocapture
      - name: Trace upstream file transfer with a debug peer (diagnostic)
        env:
          WAYPIPE_TEST_BINARY: ${{ github.workspace }}/target/upstream-debug/debug/waypipe
          WAYPIPE_TEST_COMPRESSIONS: zstd
          WAYPIPE_TRACE_WIRE: "1"
          WAYPIPE_SHM_ROUNDS: "1"
        run: |
          cargo build \
            --manifest-path vendor/waypipe/Cargo.toml \
            --locked \
            --no-default-features \
            --features lz4,zstd \
            --bin waypipe \
            --target-dir target/upstream-debug
          { echo 'WAYPIPE_VERSION<<EOF'; "$WAYPIPE_TEST_BINARY" --version; echo EOF; } >> "$GITHUB_ENV"
          if cargo test -p waypipe-client --locked --test upstream_shm -- --ignored --nocapture > target/wire-sender.log 2>&1; then
            tail -n 10 target/wire-sender.log
          else
            python3 - <<'PY'
          import re
          s = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", open("target/wire-sender.log", errors="replace").read())
          lines = s.splitlines()
          keep = [l for l in lines if any(k in l for k in ("SHM_", "WIRE", "waypipe-server", "replication failed", "panicked", "remote SHM", "Traceback"))]
          for l in keep[-90:]:
              print(re.sub(r"^\S* \S*Z ", "", l)[:240])
          raise SystemExit(1)
          PY
          fi

      - name: Test clipboard, text input, and toplevel protocols
        run: |
          cargo test -p waypane-core --locked \
            --test upstream_clipboard \
            --test upstream_text_input \
            --test upstream_toplevel \
            -- --ignored --nocapture
      - name: Test real SSH, TOFU, encrypted keys, and Termux TMPDIR
        env:
          WAYPIPE_SSHD: /usr/sbin/sshd
        run: |
          sudo mkdir -p /run/sshd
          sudo chmod 0755 /run/sshd
          sudo mkdir -p /data/data/com.termux/files/usr/tmp
          sudo chown -R "$(id -u):$(id -g)" /data/data/com.termux
          cargo test -p waypane-core --locked --test upstream_ssh -- --ignored --nocapture
      - name: Test against newest upstream release
        if: steps.upstream-baselines.outputs.has_latest == 'true'
        env:
          WAYPIPE_SSHD: /usr/sbin/sshd
        run: |
          set -euo pipefail
          read -r latest_tag latest_commit < <(python3 -c "import tomllib; m=tomllib.load(open('vendor/waypipe.upstream.toml','rb')); print(m['latest_tag'], m['latest_commit'])")
          scripts/waypipe-upstream.sh export "$latest_tag" "$latest_commit" target/upstream-latest-src
          cargo build \
            --manifest-path target/upstream-latest-src/Cargo.toml \
            --locked \
            --release \
            --no-default-features \
            --features lz4,zstd \
            --bin waypipe \
            --target-dir target/upstream-latest
          latest="$PWD/target/upstream-latest/release/waypipe"
          { echo 'WAYPIPE_VERSION<<EOF'; "$latest" --version; echo EOF; } >> "$GITHUB_ENV"
          WAYPIPE_TEST_BINARY="$latest" WAYPIPE_TEST_COMPRESSIONS=none,lz4,zstd cargo test -p waypipe-client --locked --test upstream_shm -- --ignored --nocapture
          WAYPIPE_TEST_BINARY="$latest" cargo test -p waypane-core --locked --test upstream_clipboard --test upstream_text_input --test upstream_toplevel -- --ignored --nocapture
          sudo mkdir -p /run/sshd
          sudo chmod 0755 /run/sshd
          sudo mkdir -p /data/data/com.termux/files/usr/tmp
          sudo chown -R "$(id -u):$(id -g)" /data/data/com.termux
          WAYPIPE_TEST_BINARY="$latest" cargo test -p waypane-core --locked --test upstream_ssh -- --ignored --nocapture

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # APK versionCode counts commits and versionName describes git tags.
      - name: Resolve latest LTS JDK
        id: jdk
        run: |
          version="$(curl -fsSL https://api.adoptium.net/v3/info/available_releases \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["most_recent_lts"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install latest LTS JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.version }}
      - name: Set up Android SDK 37
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.2 build-tools;37.0.0"
          log-accepted-android-sdk-licenses: false
      - name: Install current Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: current
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install latest cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64
      - name: Decode release keystore
        env:
          WAYPANE_KEYSTORE_BASE64: ${{ secrets.WAYPANE_KEYSTORE_BASE64 }}
          WAYPANE_KEYSTORE_PASSWORD: ${{ secrets.WAYPANE_KEYSTORE_PASSWORD }}
          WAYPANE_KEY_ALIAS: ${{ secrets.WAYPANE_KEY_ALIAS }}
          WAYPANE_KEY_PASSWORD: ${{ secrets.WAYPANE_KEY_PASSWORD }}
        run: |
          # Secrets are empty on fork PRs; the build then falls back to debug signing.
          if [ -n "$WAYPANE_KEYSTORE_BASE64" ] && [ -n "$WAYPANE_KEYSTORE_PASSWORD" ] && [ -n "$WAYPANE_KEY_ALIAS" ] && [ -n "$WAYPANE_KEY_PASSWORD" ]; then
            printf '%s' "$WAYPANE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/waypane-release.keystore"
            chmod 600 "$RUNNER_TEMP/waypane-release.keystore"
            echo "WAYPANE_KEYSTORE_FILE=$RUNNER_TEMP/waypane-release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build release APK with the runner's latest NDK
        working-directory: apps/android
        env:
          WAYPANE_KEYSTORE_PASSWORD: ${{ secrets.WAYPANE_KEYSTORE_PASSWORD }}
          WAYPANE_KEY_ALIAS: ${{ secrets.WAYPANE_KEY_ALIAS }}
          WAYPANE_KEY_PASSWORD: ${{ secrets.WAYPANE_KEY_PASSWORD }}
        run: |
          test -n "${ANDROID_NDK_LATEST_HOME:-}"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          cargo ndk --version
          grep '^Pkg.Revision' "$ANDROID_NDK_HOME/source.properties"
          gradle --no-daemon --stacktrace :app:assembleRelease
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | head -n 1
      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: waypane-android-release-arm64
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, desktop, upstream-interop, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gh --verify-tag and --generate-notes need git history and tags.
      - uses: actions/download-artifact@v7
        with:
          path: target/dist
      - name: Assemble release assets
        run: |
          set -euo pipefail
          version="${TAG#v}"
          apk="waypane-${version}-android-arm64.apk"
          cp target/dist/waypane-android-release-arm64/app-release.apk "$apk"
          cp target/dist/waypane-desktop-macOS-ARM64/waypane-desktop waypane-desktop-macos-arm64
          chmod 755 waypane-desktop-macos-arm64
          cp target/dist/waypane-desktop-Windows-X64/waypane-desktop.exe waypane-desktop-windows-x64.exe
          sha256sum "$apk" waypane-desktop-macos-arm64 waypane-desktop-windows-x64.exe > SHA256SUMS
          ls -lh "$apk" waypane-desktop-macos-arm64 waypane-desktop-windows-x64.exe SHA256SUMS
      - name: Publish GitHub Release
        run: |
          set -euo pipefail
          version="${TAG#v}"
          assets=("waypane-${version}-android-arm64.apk" waypane-desktop-macos-arm64 waypane-desktop-windows-x64.exe SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --title "Waypane $TAG" --generate-notes
          fi
