[package]
name = "waypane-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
jni-check = [
    "dep:jni",
    "dep:pollster",
    "dep:raw-window-handle",
    "dep:serde_json",
    "dep:shlex",
    "dep:wgpu",
]

[dependencies]
bytes = "1"
jni = { version = "0.22", optional = true }
log = "0.4"
pollster = { version = "1", optional = true }
raw-window-handle = { version = "0.6", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
shlex = { version = "2", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }
waypane-core = { path = "../waypane-core" }
waypane-render = { path = "../waypane-render", default-features = false }
waypane-transport = { path = "../waypane-transport" }
waypipe-client = { path = "../waypipe-client" }
wgpu = { version = "30.0.1", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
