[package]
name = "waypane-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bytes = "1"
thiserror = "2"
wayland-scanner = "0.31.11"
waypipe-client = { path = "../waypipe-client" }

[target.'cfg(unix)'.dependencies]
wayland-backend = { version = "0.3.17", default-features = false }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "process", "rt", "time"] }
waypane-transport = { path = "../waypane-transport" }
